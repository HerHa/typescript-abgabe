info:
  name: List Products Not Modified
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/products"
  params:
    query:
      - name: limit
        value: "20"
      - name: offset
        value: "0"
  headers:
    - name: If-None-Match
      value: "{{listEtag}}"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 304 when the product list has not changed", function() {
          expect(res.status).to.equal(304);
        });
