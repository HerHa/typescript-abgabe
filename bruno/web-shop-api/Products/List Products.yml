info:
  name: List Products
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/products"
  params:
    query:
      - name: limit
        value: "20"
      - name: offset
        value: "0"
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("listEtag", res.getHeader("etag"));
        }
    - type: tests
      code: |-
        test("returns a product array and an ETag", function() {
          expect(res.status).to.equal(200);
          expect(res.body).to.be.an("array");
          expect(res.getHeader("etag")).to.be.a("string");
        });
