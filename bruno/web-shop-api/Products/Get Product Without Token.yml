info:
  name: Get Product Without Token
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/products/{{productId}}"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("rejects requests without a bearer token", function() {
          expect(res.status).to.equal(401);
          expect(res.getHeader("www-authenticate")).to.equal("Bearer");
        });
