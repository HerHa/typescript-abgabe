info:
  name: Get Product
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/products/{{productId}}"
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("productEtag", res.getHeader("etag"));
        }
    - type: tests
      code: |-
        test("returns the product with its detail field and an ETag", function() {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.exist;
          expect(res.body).to.have.property("detail");
          expect(res.getHeader("etag")).to.be.a("string");
        });
